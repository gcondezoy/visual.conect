<!doctype html>

    <meta name="theme-color" content="#070d15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dbe4ef" media="(prefers-color-scheme: light)" />
    <title>Corporación Visual Connections | Telecomunicaciones a nivel nacional</title>

    <!-- El tema se resuelve antes de pintar para que no haya destello al cargar. -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('vc-tema')
          if (!g) {
            g = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = g
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="Partner autorizado de WIN y ENTEL. Instalación, averías, traslados y mantenimiento de telecomunicaciones en Lima, Trujillo, Piura y Chiclayo. Únete a nuestro equipo técnico."
    />
    <!-- Al publicar en el dominio propio, reemplazar esta URL en los tres
         sitios donde aparece: canonical, og:url y og:image. WhatsApp, Facebook
         y LinkedIn descartan las imágenes con ruta relativa, así que og:image
         tiene que ser una dirección absoluta. -->
    <link rel="canonical" href="https://visual-conect-seven.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Corporación Visual Connections" />

    />
    <meta property="og:image:alt" content="Logotipo de Corporación Visual Connections" />
